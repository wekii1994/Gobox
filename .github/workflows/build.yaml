name: Build Android arm64-v8a

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  IS_PRERELEASE: ${{ contains(github.ref_name, 'pre') }}
  SHOULD_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [android]
        arch: [arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust (Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Keystore (Android)
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "Using custom secrets.KEYSTORE..."
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
            echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties
          elif [ -f ".github/signing/release.keystore" ]; then
            echo "Using repository default solidified release keystore..."
            cp .github/signing/release.keystore android/app/keystore.jks
            echo "keyAlias=gobox" >> android/local.properties
            echo "storePassword=android" >> android/local.properties
            echo "keyPassword=android" >> android/local.properties
          elif [ -f "android/app/keystore.jks" ]; then
            echo "Using existing android/app/keystore.jks..."
            echo "keyAlias=gobox" >> android/local.properties
            echo "storePassword=android" >> android/local.properties
            echo "keyPassword=android" >> android/local.properties
          else
            echo "Generating persistent release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/keystore.jks \
              -alias gobox \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Gobox, OU=Gobox, O=Gobox, L=Unknown, ST=Unknown, C=US"
            echo "keyAlias=gobox" >> android/local.properties
            echo "storePassword=android" >> android/local.properties
            echo "keyPassword=android" >> android/local.properties
          fi

      - name: Setup Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          EOF

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: flutter-android-arm64-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: '3.47.7'

      - name: Clear Pub Cache Credentials
        shell: bash
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true

      - name: Clean Gradle (Android)
        run: |
          cd android
          flutter clean

      - name: Build Gobox (Android arm64-v8a)
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart android --arch arm64 ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Generate Checksums
        shell: bash
        run: |
          # Flatten any nested APKs into dist/
          find dist -mindepth 2 -name "*.apk" -exec mv -f {} dist/ \; 2>/dev/null || true
          cd dist
          find . -name "*.apk" -type f -exec sha256sum {} + > sha256sum.txt
          cat sha256sum.txt

      - name: Upload Artifacts (Android arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: Gobox-android-arm64-v8a
          path: ./dist/*
          overwrite: true

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Gobox-android-arm64-v8a
          path: ./dist/

      - name: Generate release.md
        shell: bash
        run: |
          printf '%s\n' "- Fixes and improvements" "- Recommended version update" > release.md

      - name: Patch release.md
        shell: bash
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          base_version=$(echo "$version" | sed 's/-pre[0-9]*//')
          if [ "${{ env.IS_PRERELEASE }}" == "true" ]; then
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template_pre.md >> release.md
          else
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Gobox ${{ github.ref_name }}
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
